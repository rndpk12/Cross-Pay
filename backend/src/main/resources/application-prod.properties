# Production requires all sensitive/runtime configuration to be injected by the platform.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
server.port=${SERVER_PORT:${PORT:8080}}

# Conservative defaults for a small managed deployment; tune only from observed load.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1740000
