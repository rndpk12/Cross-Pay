spring.application.name=crosspay-backend
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crosspay}

spring.datasource.username=${DB_USERNAME:crosspay}

spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}

jwt.expiration=${JWT_EXPIRATION:900000}

# Cross-origin browser access is denied until explicit, comma-separated origins are configured.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Bound headers to limit header abuse while accommodating bearer and idempotency headers.
server.max-http-request-header-size=16KB

# Only operational endpoints are exposed over HTTP. Metrics remain authenticated.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Readiness is meaningful for this database-backed application, unlike liveness.
management.endpoint.health.group.readiness.include=readinessState,db

# Key/value output stays readable locally while making request correlation searchable.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} requestId=%X{requestId:-} message=%msg%n
logging.level.com.crosspay=INFO
logging.level.org.springframework.security=WARN
